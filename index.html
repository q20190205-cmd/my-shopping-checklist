<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的購物清單</title>

<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-shopping-v1.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-shopping-v1.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="購物清單">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4eb;color:#25362c;font:16px system-ui,sans-serif}main{width:min(100% - 32px,630px);margin:28px auto 48px}header{padding:28px;border-radius:25px;background:#224638;color:#fff8df}header small{color:#dcf090}h1{font-size:clamp(29px,7vw,46px);margin:6px 0 0}button,input{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:12px;background:#e6eddf;color:#224638;padding:8px 12px;font-weight:650}button[aria-pressed=true],.primary{background:#224638;color:white}.panel{background:#fffdf7;border:1px solid #e1e4d8;border-radius:22px;padding:17px;margin:12px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}h2{font-size:22px;margin:0;overflow-wrap:anywhere}p{margin:8px 0;color:#59675c}form{display:grid;gap:9px}input[type=text]{width:100%;min-height:45px;padding:10px 12px;border:1px solid #bac9ba;border-radius:12px;background:white}label{font-weight:650}input[type=file]{display:block;width:100%;margin-top:5px;font-size:14px}input::file-selector-button{padding:9px;border:0;border-radius:8px;background:#e6eddf;color:#224638}.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #e1e4d8}.item label{display:flex;align-items:center;gap:10px;min-height:44px;overflow-wrap:anywhere}.item input{width:22px;height:22px;flex:none;accent-color:#224638}.item img{width:52px;height:52px;object-fit:cover;border-radius:10px}.done{text-decoration:line-through;color:#67756b}.remove{background:transparent;color:#8a4035;font-size:14px}.photo{padding:0;display:grid;place-items:center;background:transparent}dialog{max-width:min(92vw,550px);border:0;border-radius:18px;padding:12px;background:#fffdf7}dialog::backdrop{background:#152019bd}dialog img{display:block;max-width:100%;max-height:72vh;margin-bottom:8px}footer{color:#536255;font-size:13px}

body{background:#faf3e5;color:#29362d}header{background:linear-gradient(135deg,#123a2c,#24513a);color:#fff5db;border:1px solid #c7a45d;box-shadow:0 8px 24px #432c1420}header small{color:#ebcb80}.panel{background:#fffcf4;border-color:#eadbc2}.primary,button[aria-pressed=true]{background:#862c37;color:#fff9eb}button{background:#e7eee2;color:#224638}.install{margin-top:16px;background:#f0d397;color:#362b1e}.install-steps{padding:14px 22px;color:#4a3b35;line-height:1.6}.install-steps button{margin-top:8px}input[type=text]{border-color:#cbbd9f}

header{position:relative;isolation:isolate;overflow:hidden;padding-bottom:40px}
.snow-art{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.snowflake{position:absolute;color:#fff9e8;line-height:1;text-shadow:0 0 12px #fff6d369}
.snowflake:nth-child(1){top:16%;right:9%;font-size:33px;transform:rotate(13deg);opacity:.91}
.snowflake:nth-child(2){top:42%;right:17%;font-size:17px;transform:rotate(-15deg);opacity:.63}
.snowflake:nth-child(3){top:55%;right:5%;font-size:22px;opacity:.78}
.snowflake:nth-child(4){top:12%;right:24%;font-size:11px;opacity:.65}
.snowbank{position:absolute;inset:auto -2% -2px;height:23px;background:
 radial-gradient(ellipse at 8% 100%,#fffdf5 0 65%,transparent 68%) 0 0/30% 100% no-repeat,
 radial-gradient(ellipse at 50% 100%,#fffdf5 0 67%,transparent 70%) 38% 5px/48% 100% no-repeat,
 radial-gradient(ellipse at 82% 100%,#fffdf5 0 66%,transparent 69%) 100% 0/40% 100% no-repeat;
 border-bottom:5px solid #fffdf5}
@media(max-width:420px){.snowflake:nth-child(1){top:12%;right:7%;font-size:23px}.snowflake:nth-child(2){top:53%;right:12%}.snowflake:nth-child(3){top:65%;right:5%;font-size:16px}.snowflake:nth-child(4){display:none}}
</style>
<main><header><small>在超市、市集或出門前</small><h1>我的購物清單</h1><button class="install" id="install" type="button">＋ 加到手機主畫面</button><div class="snow-art" aria-hidden="true"><span class="snowflake">❄︎</span><span class="snowflake">❄︎</span><span class="snowflake">❅</span><span class="snowflake">✦</span><span class="snowbank"></span></div></header>
<section class="panel"><label for="nickname">你的名字</label><input id="nickname" type="text" maxlength="20" placeholder="輸入名字或暱稱" autocomplete="nickname"></section>
<form class="panel" id="add"><label for="item">要買什麼？</label><input id="item" type="text" maxlength="100" placeholder="例如：無糖豆漿" required><label for="photo">商品照片（選填）<input id="photo" type="file" accept="image/*"></label><button class="primary" id="submit">＋ 加入清單</button></form>
<section class="panel" aria-label="購物項目"><div class="head"><h2>購物項目</h2><span id="count"></span></div><p id="empty">清單是空的。先加一件想買的東西吧！</p><div id="items"></div></section><p id="status" role="status"></p><footer>名稱、品項與照片會自動保存在目前的瀏覽器。</footer></main>
<dialog id="installHelp" class="install-steps"><h2>加到手機主畫面</h2><div id="installSteps"></div><form method="dialog"><button>關閉</button></form></dialog>
<dialog id="viewer"><img alt=""><p id="photoStatus" role="status"></p><label for="replacePhoto">更換這個品項的照片<input id="replacePhoto" type="file" accept="image/*"></label><form method="dialog"><button>關閉照片</button></form></dialog>
<script>
const el=id=>document.getElementById(id);
const fromLine=/\bLine\//i.test(navigator.userAgent);
if(fromLine)el('install').textContent='在瀏覽器開啟';
el('install').onclick=()=>{
 if(fromLine){
  const url=new URL(location.href);
  url.searchParams.set('openExternalBrowser','1');
  location.assign(url.href);
  return;
 }
 const apple=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const android=/Android/.test(navigator.userAgent);
 const instructions=[
  ['iPhone／iPad','用 Safari 開啟本頁，點「分享」→「加入主畫面」→「加入」。'],
  ['Android','用 Chrome 開啟本頁，點右上角 ⋮ →「加到主畫面」，再依提示確認。']
 ];
 const relevant=apple?[instructions[0]]:android?[instructions[1]]:instructions;
 el('installSteps').replaceChildren(...relevant.map(([platform,steps])=>{
  const p=document.createElement('p');
  const strong=document.createElement('strong');strong.textContent=platform;
  p.append(strong,document.createElement('br'),steps);return p;
 }));
 el('installHelp').showModal();
};

const defaultList={id:0,name:'',items:[]};
let list=structuredClone(defaultList), viewingId=null, viewerRequest=0, adding=false;
let ready=false, pendingWrites=0, photoJobs=0, refreshRequest=0;
let writeQueue=Promise.resolve();
function syncControls(){
 const busy=!ready||pendingWrites>0||photoJobs>0;
 for(const control of document.querySelectorAll('#nickname,#add input,#add button,#items input,#items button,#replacePhoto'))control.disabled=busy;
 el('items').setAttribute('aria-busy',String(busy));
}
syncControls();el('status').textContent='正在載入清單…';el('empty').hidden=true;
const photoSources=new WeakMap();
function readPhoto(photo){
 if(typeof photo==='string')return Promise.resolve(photo);
 if(!photoSources.has(photo))photoSources.set(photo,new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>resolve(reader.result);
  reader.onerror=()=>reject(reader.error);
  reader.readAsDataURL(photo);
 }));
 return photoSources.get(photo);
}
async function preparePhoto(file){
 const source=await readPhoto(file);
 const image=new Image();
 await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=source;});
 const scale=Math.min(1,1200/Math.max(image.naturalWidth,image.naturalHeight));
 const canvas=document.createElement('canvas');
 canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
 canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
 const context=canvas.getContext('2d');
 context.fillStyle='#ffffff';context.fillRect(0,0,canvas.width,canvas.height);
 context.drawImage(image,0,0,canvas.width,canvas.height);
 return canvas.toDataURL('image/jpeg',.85);
}
async function showPhoto(id){
 const item=list.items.find(x=>x.id===id);
 if(!item?.photo)return;
 const request=++viewerRequest;
 viewingId=id;el('replacePhoto').value='';el('photoStatus').textContent='';
 const big=el('viewer').querySelector('img');big.removeAttribute('src');big.alt=item.name;
 el('viewer').showModal();
 try{const source=await readPhoto(item.photo);if(request===viewerRequest&&el('viewer').open)big.src=source;}
 catch{if(request===viewerRequest)el('photoStatus').textContent='照片無法讀取，請重新選擇。';}
}
const database=new Promise((resolve,reject)=>{
 const req=indexedDB.open('pocket-shopping',1);
 req.onupgradeneeded=()=>req.result.createObjectStore('lists',{keyPath:'id'});
 req.onsuccess=()=>resolve(req.result);
 req.onerror=()=>reject(req.error);
});
function read(db){
 return new Promise((resolve,reject)=>{
  const req=db.transaction('lists').objectStore('lists').getAll();
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}
function update(change){
 ++pendingWrites;++refreshRequest;syncControls();el('status').textContent='正在儲存，請稍候…';
 const work=writeQueue.then(()=>saveChange(change));
 writeQueue=work.then(()=>undefined,()=>undefined);
 return work.finally(()=>{--pendingWrites;syncControls();});
}
async function saveChange(change){
 try{
  await initialized;
  const db=await database;
  const next=await new Promise((resolve,reject)=>{
   const tx=db.transaction('lists','readwrite'), store=tx.objectStore('lists'), req=store.get(0);
   let value;
   req.onsuccess=()=>{
    try{value=req.result||structuredClone(defaultList);change(value);store.put(value);}
    catch(error){reject(error);tx.abort();}
   };
   tx.oncomplete=()=>resolve(value);
   tx.onabort=()=>reject(tx.error);
  });
  list=next;el('status').textContent=pendingWrites>1?'正在儲存，請稍候…':'已儲存，可以放心關閉';render();return true;
 }catch{el('status').textContent='儲存失敗，請確認瀏覽器允許儲存資料，或試試較小的照片。';return false;}
}
function render(){
 const {items}=list;
 el('count').textContent=items.filter(x=>x.done).length+' / '+items.length+' 已買';
 el('empty').hidden=!ready||items.length>0;

 el('items').replaceChildren(...items.map(item=>{
  const row=document.createElement('div');row.className='item';
  const photo=document.createElement('span');
  if(item.photo){
   const b=document.createElement('button');b.className='photo';b.setAttribute('aria-label','查看'+item.name+'的照片');
   const img=new Image();img.alt=item.name;img.width=52;img.height=52;b.append(img);photo.append(b);
   readPhoto(item.photo).then(source=>{img.src=source;}).catch(()=>{img.alt='重新選擇照片';});
   b.onclick=()=>showPhoto(item.id);
  }
  const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=item.done;
  const name=document.createElement('span');name.textContent=item.name;if(item.done)name.className='done';
  check.onchange=async()=>{const done=check.checked;if(!await update(data=>{const target=data.items.find(x=>x.id===item.id);if(target)target.done=done;}))check.checked=!done;};
  label.append(check,name);
  const del=document.createElement('button');del.textContent='刪除';del.className='remove';del.setAttribute('aria-label','刪除'+item.name);
  del.onclick=()=>{if(confirm('刪除「'+item.name+'」？'))update(data=>{data.items=data.items.filter(x=>x.id!==item.id);});};
  row.append(photo,label,del);return row;
 }));
 syncControls();
}
el('viewer').onclose=()=>{++viewerRequest;viewingId=null;el('viewer').querySelector('img').removeAttribute('src');};
el('replacePhoto').onchange=async e=>{
 const input=e.target,file=input.files[0],id=viewingId;
 if(!file||!id)return;
 const request=viewerRequest;++photoJobs;syncControls();el('photoStatus').textContent='正在儲存照片…';
 try{
  const picture=await preparePhoto(file);
  const saved=await update(data=>{const item=data.items.find(x=>x.id===id);if(item)item.photo=picture;});
  if(request===viewerRequest){
   el('photoStatus').textContent=saved?'照片已更新':'儲存失敗，請再試一次。';
   if(saved)el('viewer').querySelector('img').src=picture;
  }
 }catch{if(request===viewerRequest)el('photoStatus').textContent='這張照片無法讀取，請試試 JPG 或 PNG。';}
 finally{--photoJobs;syncControls();input.value='';}
};
let nameEdited=false;
el('nickname').oninput=e=>{
 nameEdited=true;
 const name=e.target.value.trim();
 update(data=>{data.name=name;});
};
el('add').onsubmit=async e=>{
 e.preventDefault();
 if(!ready||adding||pendingWrites||photoJobs)return;
 const name=el('item').value.trim(),photo=el('photo').files[0],button=el('submit');
 if(!name)return;
 adding=true;++photoJobs;syncControls();el('status').textContent='正在處理照片，請稍候…';
 try{
  const picture=photo?await preparePhoto(photo):null;
  if(await update(list=>{list.items.unshift({id:crypto.randomUUID(),name,photo:picture,done:false});}))e.target.reset();
 }catch{el('status').textContent='這張照片無法讀取，請試試 JPG 或 PNG。';}
 finally{adding=false;--photoJobs;syncControls();}
};
render();
const initialized=database.then(read).then(saved=>{
 list=saved.find(entry=>entry.id===0)||list;
 if(!nameEdited)el('nickname').value=list.name==='清單 1'?'':list.name;
 ready=true;el('status').textContent='清單已載入';render();
});
initialized.catch(()=>{el('status').textContent='清單載入失敗，請重新整理；原有資料不會被空白清單覆蓋。';});
async function refreshSavedList(){
 if(!ready||photoJobs)return;
 const request=++refreshRequest;
 try{
  await writeQueue;
  const saved=await read(await database);
  if(request!==refreshRequest||pendingWrites||photoJobs)return;
  list=saved.find(entry=>entry.id===0)||list;render();
 }catch{el('status').textContent='暫時無法重新讀取清單，請稍後再試。';}
}
window.addEventListener('pageshow',event=>{if(event.persisted)refreshSavedList();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshSavedList();});
window.addEventListener('beforeunload',event=>{
 if(pendingWrites||photoJobs){event.preventDefault();event.returnValue='';}
});
</script></html>
